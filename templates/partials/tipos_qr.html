<button
    type="button"
    class="type-btn{% if tipo == 'url' %} is-active{% endif %}"
    hx-get="{% url 'campos_qr' %}?tipo=url"
    hx-target="#form-fields"
    hx-swap="innerHTML"
    aria-pressed="{% if tipo == 'url' %}true{% else %}false{% endif %}"
>
    <span class="type-icon" aria-hidden="true">🔗</span>
    Enlace
</button>
